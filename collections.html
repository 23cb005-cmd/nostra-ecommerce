<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nostra | Collections</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav-bar">
      <a href="index.html" class="brand">Nostra</a>
      <ul class="nav-links" data-nav-links>
        <li><a href="index.html">Home</a></li>
        <li><a href="collections.html" aria-current="page">Collections</a></li>
        <li><a href="contact.html">Contact Us</a></li>
      </ul>
      <button class="nav-toggle" data-nav-toggle aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
    </nav>
  </header>

  <main class="section">
    <h1 class="section-title">Collections</h1>

    <div class="collections-controls">
      <input
        type="search"
        class="search-box"
        placeholder="Search products..."
        aria-label="Search products"
        data-search-input
      />
      <div class="filter-buttons">
        <button class="filter-btn" data-filter-btn="All" aria-pressed="true">All</button>
        <button class="filter-btn" data-filter-btn="Men" aria-pressed="false">Men</button>
        <button class="filter-btn" data-filter-btn="Women" aria-pressed="false">Women</button>
        <button class="filter-btn" data-filter-btn="Accessories" aria-pressed="false">Accessories</button>
      </div>
    </div>

    <div class="product-grid" data-product-grid></div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Nostra. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
