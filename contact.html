<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nostra | Contact Us</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <nav class="nav-bar">
      <a href="index.html" class="brand">Nostra</a>
      <ul class="nav-links" data-nav-links>
        <li><a href="index.html">Home</a></li>
        <li><a href="collections.html">Collections</a></li>
        <li><a href="contact.html" aria-current="page">Contact Us</a></li>
      </ul>
      <button class="nav-toggle" data-nav-toggle aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
    </nav>
  </header>

  <main class="section">
    <h1 class="section-title">Contact Us</h1>

    <div class="contact-layout">
      <form class="contact-form" data-contact-form novalidate>
        <div class="form-message" data-form-message></div>

        <div>
          <label for="name">Name</label>
          <input type="text" id="name" name="name" />
          <span class="field-error" data-error-for="name"></span>
        </div>

        <div>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" />
          <span class="field-error" data-error-for="email"></span>
        </div>

        <div>
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="5"></textarea>
          <span class="field-error" data-error-for="message"></span>
        </div>

        <button type="submit" class="btn">Send Message</button>
      </form>

      <aside class="contact-info">
        <h3>Get in touch</h3>
        <p>Nostra Studio</p>
        <p>221 Market Street, Suite 400</p>
        <p>San Francisco, CA 94103</p>
        <p>hello@nostra.example</p>
        <p>+1 (555) 019-2834</p>
      </aside>
    </div>
  </main>

  <footer class="site-footer">
    <p>&copy; 2026 Nostra. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
